name: Hardening — SAST/DAST/Lighthouse

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESLint security (no-dansql, no-secrets)
        run: pnpm dlx eslint src --ext .ts,.tsx --max-warnings 0
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/auto
            r/typescript
            r/java
            r/go
            r/python
      - name: govulncheck (Go)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./services/go-gateway/...
      - name: pip-audit (Python)
        run: pip install pip-audit && pip-audit --desc

  dast:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a"

  lighthouse:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/offline
          budgetPath: ./lighthouserc.json
          uploadArtifacts: true

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pnpm dlx size-limit || echo "budgets: shell <180kb, mfe <90kb"
